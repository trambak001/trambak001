<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS REFLEX TEST — Het Bhatiya</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue:   #00d4ff;
    --orange: #FF6B35;
    --red:    #ff3300;
    --bg:     #0a0a0a;
    --panel:  #0d1117;
    --dim:    #1a1f2e;
  }

  body {
    background: var(--bg);
    color: var(--blue);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    overflow: hidden;
    user-select: none;
  }

  /* ── scanline overlay ── */
  body::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,255,.018) 2px,
      rgba(0,212,255,.018) 4px
    );
    z-index: 99;
  }

  /* ── header ── */
  header {
    text-align: center;
    letter-spacing: 6px;
    font-size: clamp(.75rem, 2.5vw, .95rem);
  }
  header h1 {
    font-size: clamp(1rem, 4vw, 1.5rem);
    letter-spacing: 8px;
    color: var(--blue);
    text-shadow: 0 0 18px var(--blue);
    margin-bottom: 4px;
  }
  header p { color: rgba(0,212,255,.5); font-size: .7rem; letter-spacing: 4px; }

  /* ── HUD bar ── */
  #hud {
    display: flex;
    gap: clamp(16px, 5vw, 40px);
    background: var(--panel);
    border: 1px solid rgba(0,212,255,.15);
    border-radius: 6px;
    padding: 10px 24px;
  }
  .stat { text-align: center; min-width: 48px; }
  .stat-val {
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }
  .stat-label {
    font-size: .6rem;
    letter-spacing: 2px;
    color: rgba(0,212,255,.5);
    margin-top: 2px;
  }

  /* ── timer bar ── */
  #bar-wrap {
    width: min(440px, 92vw);
    height: 3px;
    background: var(--dim);
    border-radius: 2px;
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 100%;
    background: var(--blue);
    border-radius: 2px;
    transition: background .1s;
    transform-origin: left;
  }

  /* ── arena ── */
  #arena {
    width: min(440px, 92vw);
    height: min(440px, 92vw);
    background: var(--panel);
    border: 1px solid rgba(0,212,255,.12);
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
    flex-shrink: 0;
  }

  /* grid lines */
  #arena::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg,  transparent, transparent 43px, rgba(0,212,255,.05) 43px, rgba(0,212,255,.05) 44px),
      repeating-linear-gradient(90deg, transparent, transparent 43px, rgba(0,212,255,.05) 43px, rgba(0,212,255,.05) 44px);
  }

  /* corner brackets */
  #arena::after {
    content: '';
    position: absolute; inset: 8px; pointer-events: none;
    border: 1px solid rgba(0,212,255,.08);
    border-radius: 6px;
  }

  /* ── target ── */
  #target {
    position: absolute;
    display: none;
    cursor: pointer;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  #target .ring {
    position: relative;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #FF8C5A, #cc2800);
    border: 2px solid rgba(255,160,100,.7);
    box-shadow: 0 0 16px rgba(255,107,53,.7), 0 0 40px rgba(255,107,53,.35);
    animation: tpulse .45s infinite alternate;
    transition: transform .08s;
  }
  #target:hover .ring { transform: scale(1.12); }
  #target .crosshair {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #target .crosshair::before,
  #target .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,.35);
    border-radius: 1px;
  }
  #target .crosshair::before { width: 16px; height: 2px; }
  #target .crosshair::after  { width: 2px; height: 16px; }

  @keyframes tpulse {
    from { box-shadow: 0 0 16px rgba(255,107,53,.7), 0 0 40px rgba(255,107,53,.35); }
    to   { box-shadow: 0 0 28px rgba(255,107,53,.9), 0 0 60px rgba(255,107,53,.55); }
  }

  /* ── hit flash ── */
  .flash {
    position: absolute; inset: 0; pointer-events: none;
    border-radius: 10px;
    animation: flashout .25s ease-out forwards;
  }
  @keyframes flashout {
    0%   { background: rgba(0,212,255,.08); }
    100% { background: transparent; }
  }
  .flash-miss {
    animation: flashmiss .25s ease-out forwards;
  }
  @keyframes flashmiss {
    0%   { background: rgba(255,50,0,.12); }
    100% { background: transparent; }
  }

  /* ── ripple on miss click ── */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(255,50,0,.5);
    pointer-events: none;
    width: 10px; height: 10px;
    transform: translate(-50%,-50%);
    animation: rippleout .4s ease-out forwards;
  }
  @keyframes rippleout {
    to { width: 70px; height: 70px; opacity: 0; }
  }

  /* ── message ── */
  #msg {
    height: 18px;
    font-size: clamp(.65rem, 2vw, .8rem);
    letter-spacing: 3px;
    color: rgba(0,212,255,.7);
    text-align: center;
  }

  /* ── button ── */
  #btn {
    padding: 10px 36px;
    background: transparent;
    border: 1px solid var(--blue);
    color: var(--blue);
    font-family: 'Courier New', monospace;
    font-size: clamp(.75rem, 2.5vw, .9rem);
    letter-spacing: 4px;
    cursor: pointer;
    border-radius: 4px;
    text-shadow: 0 0 8px var(--blue);
    box-shadow: 0 0 12px rgba(0,212,255,.15), inset 0 0 12px rgba(0,212,255,.04);
    transition: all .2s;
  }
  #btn:hover {
    background: rgba(0,212,255,.1);
    box-shadow: 0 0 20px rgba(0,212,255,.3), inset 0 0 20px rgba(0,212,255,.08);
  }
  #btn:active { transform: scale(.97); }

  /* ── difficulty selector ── */
  #diff-wrap {
    display: flex; gap: 8px; align-items: center;
    font-size: .65rem; letter-spacing: 3px; color: rgba(0,212,255,.5);
  }
  .diff-btn {
    background: transparent;
    border: 1px solid rgba(0,212,255,.25);
    color: rgba(0,212,255,.5);
    font-family: 'Courier New', monospace;
    font-size: .6rem; letter-spacing: 2px;
    padding: 4px 10px; cursor: pointer; border-radius: 3px;
    transition: all .15s;
  }
  .diff-btn.active, .diff-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
    background: rgba(0,212,255,.08);
  }

  /* ── end overlay ── */
  #end-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(10,10,10,.88);
    border-radius: 10px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 24px;
  }
  #end-overlay.show { display: flex; }
  #end-overlay h2 {
    font-size: clamp(1rem, 4vw, 1.4rem);
    letter-spacing: 6px;
    text-shadow: 0 0 20px var(--blue);
  }
  #end-overlay .grade {
    font-size: clamp(1.8rem, 8vw, 3rem);
    font-weight: 700;
    letter-spacing: 4px;
  }
  #end-overlay .stats-row {
    display: flex; gap: 24px; justify-content: center;
    flex-wrap: wrap;
  }
  #end-overlay .e-stat { text-align: center; }
  #end-overlay .e-val  { font-size: 1.3rem; color: #fff; }
  #end-overlay .e-lbl  { font-size: .6rem; letter-spacing: 2px; color: rgba(0,212,255,.5); }

  /* ── footer link ── */
  footer {
    font-size: .6rem; letter-spacing: 3px;
    color: rgba(0,212,255,.3);
    text-align: center;
  }
  footer a { color: rgba(0,212,255,.5); text-decoration: none; }
  footer a:hover { color: var(--blue); }
</style>
</head>
<body>

<header>
  <h1>◈ J.A.R.V.I.S ◈</h1>
  <p>REFLEX TEST  ·  UNIT: HET_BHATIYA  ·  v1.0</p>
</header>

<div id="hud">
  <div class="stat"><div class="stat-val" id="score">0</div><div class="stat-label">HITS</div></div>
  <div class="stat"><div class="stat-val" id="misses-val">0</div><div class="stat-label">MISSES</div></div>
  <div class="stat"><div class="stat-val" id="best">—</div><div class="stat-label">BEST ms</div></div>
  <div class="stat"><div class="stat-val" id="acc">—</div><div class="stat-label">ACC %</div></div>
</div>

<div id="bar-wrap"><div id="bar"></div></div>

<div id="arena">
  <div id="target"><div class="ring"></div><div class="crosshair"></div></div>
  <div id="end-overlay">
    <h2>MISSION COMPLETE</h2>
    <div class="grade" id="grade">—</div>
    <div class="stats-row">
      <div class="e-stat"><div class="e-val" id="e-hits">0</div><div class="e-lbl">HITS</div></div>
      <div class="e-stat"><div class="e-val" id="e-acc">0%</div><div class="e-lbl">ACCURACY</div></div>
      <div class="e-stat"><div class="e-val" id="e-best">—</div><div class="e-lbl">BEST ms</div></div>
      <div class="e-stat"><div class="e-val" id="e-avg">—</div><div class="e-lbl">AVG ms</div></div>
    </div>
  </div>
</div>

<div id="msg">PRESS START — SELECT DIFFICULTY FIRST</div>

<div id="diff-wrap">
  MODE:
  <button class="diff-btn" data-d="easy">EASY</button>
  <button class="diff-btn active" data-d="normal">NORMAL</button>
  <button class="diff-btn" data-d="hard">HARD</button>
</div>

<button id="btn">▶ START</button>

<footer>
  built by <a href="https://github.com/trambak001" target="_blank">@trambak001</a>
  · <a href="https://github.com/trambak001" target="_blank">github</a>
  · <a href="https://www.linkedin.com/in/bhatiyahet" target="_blank">linkedin</a>
</footer>

<script>
  // ── config by difficulty ──
  const CONFIGS = {
    easy:   { timeLimit: 2200, rounds: 10, minWait: 800,  maxWait: 1600, targetSize: 60 },
    normal: { timeLimit: 1500, rounds: 10, minWait: 600,  maxWait: 1300, targetSize: 52 },
    hard:   { timeLimit: 900,  rounds: 12, minWait: 400,  maxWait: 900,  targetSize: 40 },
  };

  let cfg        = CONFIGS.normal;
  let score      = 0;
  let missCount  = 0;
  let best       = Infinity;
  let times      = [];
  let gameActive = false;
  let round      = 0;
  let spawnTime  = 0;
  let barTimer   = null;
  let waitTimer  = null;

  const arena     = document.getElementById('arena');
  const target    = document.getElementById('target');
  const scoreEl   = document.getElementById('score');
  const missesEl  = document.getElementById('misses-val');
  const bestEl    = document.getElementById('best');
  const accEl     = document.getElementById('acc');
  const msgEl     = document.getElementById('msg');
  const btn       = document.getElementById('btn');
  const bar       = document.getElementById('bar');
  const endOver   = document.getElementById('end-overlay');
  const diffBtns  = document.querySelectorAll('.diff-btn');

  // difficulty picker
  diffBtns.forEach(b => {
    b.addEventListener('click', () => {
      if (gameActive) return;
      diffBtns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      cfg = CONFIGS[b.dataset.d];
    });
  });

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function updateAcc() {
    const total = score + missCount;
    accEl.textContent = total ? Math.round(score / total * 100) + '%' : '—';
  }

  function flash(type) {
    const el = document.createElement('div');
    el.className = 'flash' + (type === 'miss' ? ' flash-miss' : '');
    arena.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function spawnTarget() {
    const sz  = cfg.targetSize;
    const pad = sz / 2 + 6;
    const maxX = arena.clientWidth  - pad;
    const maxY = arena.clientHeight - pad;
    const x = rand(pad, maxX);
    const y = rand(pad, maxY);

    target.style.left = x + 'px';
    target.style.top  = y + 'px';
    target.querySelector('.ring').style.width  = sz + 'px';
    target.querySelector('.ring').style.height = sz + 'px';
    target.style.display = 'block';
    spawnTime = Date.now();
    msgEl.textContent = `ROUND ${round}/${cfg.rounds}  —  ACQUIRE TARGET`;

    let elapsed = 0;
    clearInterval(barTimer);
    bar.style.transition = 'background .1s';
    barTimer = setInterval(() => {
      elapsed += 50;
      const pct = Math.max(0, (cfg.timeLimit - elapsed) / cfg.timeLimit * 100);
      bar.style.width = pct + '%';
      bar.style.background =
        pct > 50 ? '#00d4ff' : pct > 20 ? '#FF6B35' : '#ff3300';
      if (elapsed >= cfg.timeLimit) { clearInterval(barTimer); onMiss(); }
    }, 50);
  }

  function onHit() {
    const rt = Date.now() - spawnTime;
    clearInterval(barTimer);
    target.style.display = 'none';
    bar.style.width = '0%';
    times.push(rt);
    if (rt < best) { best = rt; bestEl.textContent = rt; }
    score++;
    scoreEl.textContent = score;
    updateAcc();
    flash('hit');
    const tag = rt < 300 ? '⚡ LIGHTNING' : rt < 500 ? '✓ SHARP' : rt < 800 ? '○ SOLID' : '△ SLOW';
    msgEl.textContent = `HIT  ${rt}ms  ${tag}`;
    nextRound();
  }

  function onMiss(e) {
    clearInterval(barTimer);
    target.style.display = 'none';
    bar.style.width = '0%';
    missCount++;
    missesEl.textContent = missCount;
    updateAcc();
    flash('miss');
    if (e) {
      const r = document.createElement('div');
      r.className = 'ripple';
      const rect = arena.getBoundingClientRect();
      r.style.left = (e.clientX - rect.left) + 'px';
      r.style.top  = (e.clientY - rect.top)  + 'px';
      arena.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
    }
    msgEl.textContent = 'MISS — RECALIBRATING';
    nextRound();
  }

  function nextRound() {
    round++;
    if (round > cfg.rounds) { endGame(); return; }
    clearTimeout(waitTimer);
    waitTimer = setTimeout(spawnTarget, rand(cfg.minWait, cfg.maxWait));
  }

  function endGame() {
    gameActive = false;
    const total = score + missCount;
    const accPct = total ? Math.round(score / total * 100) : 0;
    const avgMs  = times.length ? Math.round(times.reduce((a,b)=>a+b,0)/times.length) : 0;

    const grade =
      accPct >= 90 && best < 350 ? { label: 'S — IRON MAN', color: '#00d4ff' } :
      accPct >= 80 && best < 500 ? { label: 'A — SHARP',    color: '#66ff99' } :
      accPct >= 65               ? { label: 'B — SOLID',    color: '#FF6B35' } :
      accPct >= 50               ? { label: 'C — TRAINING', color: '#ffcc00' } :
                                   { label: 'D — RECALIBRATE', color: '#ff4444' };

    document.getElementById('grade').textContent  = grade.label;
    document.getElementById('grade').style.color  = grade.color;
    document.getElementById('e-hits').textContent = score;
    document.getElementById('e-acc').textContent  = accPct + '%';
    document.getElementById('e-best').textContent = best === Infinity ? '—' : best + 'ms';
    document.getElementById('e-avg').textContent  = avgMs ? avgMs + 'ms' : '—';
    endOver.classList.add('show');

    btn.textContent = '↺ PLAY AGAIN';
    btn.style.display = 'block';
    msgEl.textContent = `MISSION COMPLETE  ·  ${score}/${total} HITS  ·  ${accPct}% ACC`;
  }

  target.addEventListener('click', (e) => {
    if (!gameActive) return;
    e.stopPropagation();
    onHit();
  });

  arena.addEventListener('click', (e) => {
    if (!gameActive || target.style.display === 'none') return;
    onMiss(e);
  });

  btn.addEventListener('click', () => {
    score = 0; missCount = 0; best = Infinity; round = 1; times = [];
    scoreEl.textContent = '0'; missesEl.textContent = '0';
    bestEl.textContent = '—'; accEl.textContent = '—';
    endOver.classList.remove('show');
    gameActive = true;
    btn.style.display = 'none';
    msgEl.textContent = 'GET READY...';
    bar.style.width = '100%';
    clearTimeout(waitTimer); clearInterval(barTimer);
    waitTimer = setTimeout(spawnTarget, rand(cfg.minWait, cfg.maxWait));
  });
</script>
</body>
</html>
